[project]
name = "bookfinder-server"
version = "0.1.0"
description = "架上寻书 FastAPI 后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.32",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # fastapi.testclient → starlette.testclient 需要它，缺了会让
    # tests/test_auth.py 等 4 个 API 测试文件在收集阶段就 ImportError
    "httpx2>=2.13",
]

[tool.uv]
package = false
